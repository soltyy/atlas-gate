# HAProxy 2.8. Both transports must lead to the explicitly enrolled Router.
.if streq("${CODEX_CHECK_TOKEN}", "") || streq("${CLAUDE_CHECK_TOKEN}", "") || streq("${CODEX_NODE_ID}", "") || streq("${CLAUDE_NODE_ID}", "") || streq("${CODEX_BOOT_ID}", "") || streq("${CLAUDE_BOOT_ID}", "")
    .alert "Both check tokens, node IDs and verified boot IDs are required"
.endif
.if streq("${CODEX_LISTEN_PORT}", "") || streq("${CODEX_DIRECT_PORT}", "") || streq("${CODEX_STANDBY_PORT}", "") || streq("${CLAUDE_LISTEN_PORT}", "") || streq("${CLAUDE_DIRECT_PORT}", "") || streq("${CLAUDE_STANDBY_PORT}", "")
    .alert "All six loopback ports are required"
.endif

global
    presetenv ROUTER_PATH_WATCHER /usr/local/lib/atlas-router-standby/path_checks.lua
    lua-load "${ROUTER_PATH_WATCHER}"

defaults
    mode tcp
    retries 0
    timeout connect 4s
    timeout client 0
    timeout server 0

frontend codex
    bind "127.0.0.1:${CODEX_LISTEN_PORT}"
    acl direct_node lua.path_identity(codex,direct,current),json_query('$.nodeId') -m str "${CODEX_NODE_ID}"
    acl direct_boot lua.path_identity(codex,direct,current),json_query('$.bootId') -m str "${CODEX_BOOT_ID}"
    acl direct_v1 lua.path_identity(codex,direct,current),json_query('$.protocolVersion','int') -m int eq 1
    acl standby_node lua.path_identity(codex,standby,current),json_query('$.nodeId') -m str "${CODEX_NODE_ID}"
    acl standby_boot lua.path_identity(codex,standby,current),json_query('$.bootId') -m str "${CODEX_BOOT_ID}"
    acl standby_v1 lua.path_identity(codex,standby,current),json_query('$.protocolVersion','int') -m int eq 1
    acl last_node lua.path_identity(codex,direct,seen),json_query('$.nodeId') -m str "${CODEX_NODE_ID}"
    acl last_boot lua.path_identity(codex,direct,seen),json_query('$.bootId') -m str "${CODEX_BOOT_ID}"
    acl last_v1 lua.path_identity(codex,direct,seen),json_query('$.protocolVersion','int') -m int eq 1
    acl seen lua.path_identity(codex,direct,seen) -m found
    use_backend codex_direct if direct_node direct_boot direct_v1
    use_backend codex_standby if standby_node standby_boot standby_v1 last_node last_boot last_v1
    use_backend codex_standby if standby_node standby_boot standby_v1 !seen

frontend claude
    bind "127.0.0.1:${CLAUDE_LISTEN_PORT}"
    acl direct_node lua.path_identity(claude,direct,current),json_query('$.nodeId') -m str "${CLAUDE_NODE_ID}"
    acl direct_boot lua.path_identity(claude,direct,current),json_query('$.bootId') -m str "${CLAUDE_BOOT_ID}"
    acl direct_v1 lua.path_identity(claude,direct,current),json_query('$.protocolVersion','int') -m int eq 1
    acl standby_node lua.path_identity(claude,standby,current),json_query('$.nodeId') -m str "${CLAUDE_NODE_ID}"
    acl standby_boot lua.path_identity(claude,standby,current),json_query('$.bootId') -m str "${CLAUDE_BOOT_ID}"
    acl standby_v1 lua.path_identity(claude,standby,current),json_query('$.protocolVersion','int') -m int eq 1
    acl last_node lua.path_identity(claude,direct,seen),json_query('$.nodeId') -m str "${CLAUDE_NODE_ID}"
    acl last_boot lua.path_identity(claude,direct,seen),json_query('$.bootId') -m str "${CLAUDE_BOOT_ID}"
    acl last_v1 lua.path_identity(claude,direct,seen),json_query('$.protocolVersion','int') -m int eq 1
    acl seen lua.path_identity(claude,direct,seen) -m found
    use_backend claude_direct if direct_node direct_boot direct_v1
    use_backend claude_standby if standby_node standby_boot standby_v1 last_node last_boot last_v1
    use_backend claude_standby if standby_node standby_boot standby_v1 !seen

backend codex_direct
    server path "127.0.0.1:${CODEX_DIRECT_PORT}"

backend codex_standby
    server path "127.0.0.1:${CODEX_STANDBY_PORT}"

backend claude_direct
    server path "127.0.0.1:${CLAUDE_DIRECT_PORT}"

backend claude_standby
    server path "127.0.0.1:${CLAUDE_STANDBY_PORT}"
