# HAProxy 2.8. Изолированные TCP-порты выбираются при запуске.
# Наблюдённый через прямой путь BOOT_ID закрепляет экземпляр для резерва.
.if streq("${CODEX_CHECK_TOKEN}", "") || streq("${CLAUDE_CHECK_TOKEN}", "") || streq("${CODEX_NODE_ID}", "") || streq("${CLAUDE_NODE_ID}", "") || streq("${CODEX_BOOT_ID}", "") || streq("${CLAUDE_BOOT_ID}", "")
    .alert "Both check tokens, node IDs and verified standby boot IDs are required"
.endif
.if streq("${CODEX_LISTEN_PORT}", "") || streq("${CODEX_DIRECT_PORT}", "") || streq("${CODEX_STANDBY_PORT}", "") || streq("${CLAUDE_LISTEN_PORT}", "") || streq("${CLAUDE_DIRECT_PORT}", "") || streq("${CLAUDE_STANDBY_PORT}", "")
    .alert "All six loopback ports are required"
.endif

global
    # В этом процессе /v1/node занимает до 32 КиБ, остальное — запас для HTTP.
    tune.bufsize 40960
    presetenv ROUTER_PATH_CHECK_INTERVAL 30s

defaults
    mode tcp
    retries 0
    timeout connect 4s
    timeout check 5s
    timeout client 0
    timeout server 0
    default-server inter "${ROUTER_PATH_CHECK_INTERVAL}" fall 1 rise 1

# Каждое новое соединение получает один backend. При возврате прямого пути
# открытые потоки продолжают работать. Пока ни один путь не проверен, вход
# закрывается. Это важно также при старте, когда HAProxy ещё не выполнил пробы.
frontend codex
    bind "127.0.0.1:${CODEX_LISTEN_PORT}"
    acl direct_up nbsrv(codex_direct) gt 0
    acl direct_seen var(proc.codex_direct) -m found
    acl direct_size var(proc.codex_direct),length le 32768
    acl direct_node var(proc.codex_direct),json_query('$.nodeId') -m str "${CODEX_NODE_ID}"
    acl direct_v1 var(proc.codex_direct),json_query('$.protocolVersion','int') -m int eq 1
    acl direct_boot var(proc.codex_direct),json_query('$.bootId'),length gt 0
    acl direct_pinned var(proc.codex_direct),json_query('$.bootId') -m str "${CODEX_BOOT_ID}"
    acl standby_up nbsrv(codex_standby) gt 0
    acl standby_size var(proc.codex_standby),length le 32768
    acl standby_node var(proc.codex_standby),json_query('$.nodeId') -m str "${CODEX_NODE_ID}"
    acl standby_v1 var(proc.codex_standby),json_query('$.protocolVersion','int') -m int eq 1
    acl standby_pinned var(proc.codex_standby),json_query('$.bootId') -m str "${CODEX_BOOT_ID}"
    use_backend codex_direct if direct_up direct_size direct_node direct_v1 direct_boot
    use_backend codex_standby if standby_up standby_size standby_node standby_v1 standby_pinned direct_size direct_node direct_v1 direct_pinned
    use_backend codex_standby if standby_up standby_size standby_node standby_v1 standby_pinned !direct_seen

frontend claude
    bind "127.0.0.1:${CLAUDE_LISTEN_PORT}"
    acl direct_up nbsrv(claude_direct) gt 0
    acl direct_seen var(proc.claude_direct) -m found
    acl direct_size var(proc.claude_direct),length le 32768
    acl direct_node var(proc.claude_direct),json_query('$.nodeId') -m str "${CLAUDE_NODE_ID}"
    acl direct_v1 var(proc.claude_direct),json_query('$.protocolVersion','int') -m int eq 1
    acl direct_boot var(proc.claude_direct),json_query('$.bootId'),length gt 0
    acl direct_pinned var(proc.claude_direct),json_query('$.bootId') -m str "${CLAUDE_BOOT_ID}"
    acl standby_up nbsrv(claude_standby) gt 0
    acl standby_size var(proc.claude_standby),length le 32768
    acl standby_node var(proc.claude_standby),json_query('$.nodeId') -m str "${CLAUDE_NODE_ID}"
    acl standby_v1 var(proc.claude_standby),json_query('$.protocolVersion','int') -m int eq 1
    acl standby_pinned var(proc.claude_standby),json_query('$.bootId') -m str "${CLAUDE_BOOT_ID}"
    use_backend claude_direct if direct_up direct_size direct_node direct_v1 direct_boot
    use_backend claude_standby if standby_up standby_size standby_node standby_v1 standby_pinned direct_size direct_node direct_v1 direct_pinned
    use_backend claude_standby if standby_up standby_size standby_node standby_v1 standby_pinned !direct_seen

# Токен передаётся только в служебный GET. Клиентский трафик проходит байт
# в байт. Перед публикацией снимка ждём тело до конца или до лимита буфера.
backend codex_direct
    option httpchk
    http-check send meth GET uri /v1/node ver HTTP/1.1 hdr Host localhost hdr X-Atlas-Token "${CODEX_CHECK_TOKEN}"
    http-check expect status 200
    http-check expect min-recv 40960 rstring '"protocolVersion"[[:space:]]*:[[:space:]]*1[[:space:]]*[,}]'
    http-check set-var(proc.codex_direct) res.body
    server path "127.0.0.1:${CODEX_DIRECT_PORT}" check

backend codex_standby
    option httpchk
    http-check send meth GET uri /v1/node ver HTTP/1.1 hdr Host localhost hdr X-Atlas-Token "${CODEX_CHECK_TOKEN}"
    http-check expect status 200
    http-check expect min-recv 40960 rstring '"protocolVersion"[[:space:]]*:[[:space:]]*1[[:space:]]*[,}]'
    http-check set-var(proc.codex_standby) res.body
    server path "127.0.0.1:${CODEX_STANDBY_PORT}" check

backend claude_direct
    option httpchk
    http-check send meth GET uri /v1/node ver HTTP/1.1 hdr Host localhost hdr X-Atlas-Token "${CLAUDE_CHECK_TOKEN}"
    http-check expect status 200
    http-check expect min-recv 40960 rstring '"protocolVersion"[[:space:]]*:[[:space:]]*1[[:space:]]*[,}]'
    http-check set-var(proc.claude_direct) res.body
    server path "127.0.0.1:${CLAUDE_DIRECT_PORT}" check

backend claude_standby
    option httpchk
    http-check send meth GET uri /v1/node ver HTTP/1.1 hdr Host localhost hdr X-Atlas-Token "${CLAUDE_CHECK_TOKEN}"
    http-check expect status 200
    http-check expect min-recv 40960 rstring '"protocolVersion"[[:space:]]*:[[:space:]]*1[[:space:]]*[,}]'
    http-check set-var(proc.claude_standby) res.body
    server path "127.0.0.1:${CLAUDE_STANDBY_PORT}" check
