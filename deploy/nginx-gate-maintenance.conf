# Include inside the HTTPS server. Install once with nginx -t/reload.
# Root deploy guard creates/removes this marker while the Gate TCP listener is down.
# This is NOT a negative receipt for an old key and MUST NOT carry a complete header.
error_page 503 = @atlas_gate_maintenance;
if (-f /run/atlas-gate-maintenance) { return 503; }
location @atlas_gate_maintenance {
    default_type application/json;
    add_header Retry-After 1 always;
    return 503 '{"error":{"code":"gate_maintenance","message":"Gate is updating; reconcile after the pause","retryable":true}}';
}
