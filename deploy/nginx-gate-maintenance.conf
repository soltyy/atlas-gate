# Include inside the HTTPS server. Install once with nginx -t/reload.
# Root deploy guard creates/removes this marker while the Gate TCP listener is down.
# This is NOT a negative receipt for an old key and MUST NOT carry a complete header.
error_page 503 = @atlas_gate_maintenance;
error_page 418 = @atlas_gate_api_contract_unavailable;
# Only the final marker, published from a fresh authenticated runtime probe,
# permits managed POSTs. A .pending staging file is never sufficient.
# Keep this guard installed when switching or rolling back to a legacy Gate.
set $atlas_api_contract_block 0;
if ($http_x_atlas_api_attempt_contract != "") { set $atlas_api_contract_block 1; }
if (-f /run/atlas-gate-api-attempt-v1) { set $atlas_api_contract_block 0; }
set $atlas_api_contract_block "$atlas_api_contract_block:$request_method:$uri";
if ($atlas_api_contract_block ~ "^1:POST:/harness/llm/v1/") { return 418; }
set $atlas_gate_admission "";
if (-f /run/atlas-gate-admission) { set $atlas_gate_admission "blocked:"; }
set $atlas_gate_admission "$atlas_gate_admission$request_method:$uri";
if ($atlas_gate_admission ~ "^blocked:POST:/harness/(agent/sessions$|agent/sessions/[^/]+/prompt$|llm/v1/)") { return 503; }
if (-f /run/atlas-gate-maintenance) { return 503; }
location @atlas_gate_maintenance {
    default_type application/json;
    add_header Retry-After 1 always;
    return 503 '{"error":{"code":"gate_maintenance","message":"Gate is updating; reconcile after the pause","retryable":true}}';
}
location @atlas_gate_api_contract_unavailable {
    default_type application/json;
    return 503 '{"error":{"code":"api_attempt_contract_unavailable","message":"Gate cannot provide API attempt receipts; refresh profile","retryable":false,"originalOutcome":"unknown"}}';
}
