# Include inside the HTTPS server, replacing any blanket /harness/admin deny.
# Gate must bind loopback, ATLAS_TRUST_LOCAL=false, ATLAS_TOKEN nonempty.
# All other requests use the normal proxy location and retain X-Forwarded-For.
location = /harness/admin {
    return 308 /harness/admin/$is_args$args;
}

# Only the static UI bypasses the application's loopback-only page guard.
# This page contains no credentials; its API calls require X-Atlas-Token.
location = /harness/admin/ {
    proxy_pass http://127.0.0.1:8766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Connection "";
}

location ^~ /harness/admin/assets/ {
    proxy_pass http://127.0.0.1:8766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Connection "";
}
