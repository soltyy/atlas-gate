[project]
name = "atlas-gate"
version = "0.2.0"
description = "Централизованный доступ к распределённым Atlas Router"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "httpx>=0.28.1", "pydantic-settings>=2.15.0", "pyjwt[crypto]>=2.14.0", "sse-starlette>=3.4.11", "uvicorn[standard]>=0.53.0"]

[project.scripts]
atlas-gate = "atlas_gate.main:main"
atlas-gate-pki = "atlas_gate.node_pki:main"
atlas-gate-migrate = "atlas_gate.migrate:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_gate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
