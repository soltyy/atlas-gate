name: Gate contracts
on:
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gate-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  standby:
    name: Isolated SSH path selector
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution HAProxy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends haproxy
      - name: Exercise failover in a loopback-only network namespace
        run: |
          sudo unshare --net -- bash -eu -c '
            ip link set lo up
            exec runuser -u "$1" -- /usr/bin/python3 tests/ops/router_standby_canary.py \
              --haproxy /usr/sbin/haproxy --config deploy/router-standby/haproxy.cfg
          ' standby "$(id -un)"
  linux:
    name: Gate core (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - name: Install isolated test environment
        run: uv sync --locked
      # The private Router checkout is tested by the paired Router workflow.
      # A Gate-scoped GITHUB_TOKEN must not be replaced by a broad personal token.
      - name: Gate core suite
        env:
          ATLAS_LIVE: '0'
        run: |
          mkdir -p out
          uv run --no-sync pytest -q --junitxml=out/gate-core.xml
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-contracts-linux
          path: out/gate-core.xml
