name: Gate contracts
on:
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gate-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: full-suite and Router wire (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: soltyy/atlas-router
          ref: 4696d47008a0554c5c2bcba69c1de0481d2901cf
          path: out/router
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - name: Install isolated test environment
        run: |
          uv sync --locked
          uv export --locked --no-dev --no-emit-project --project out/router --output-file out/router-requirements.txt
          uv pip install --python .venv/bin/python -r out/router-requirements.txt
          uv pip install --python .venv/bin/python --no-deps out/router
      - name: Full Gate suite with actual Router HTTP handlers
        env:
          ATLAS_LIVE: '0'
          ATLAS_TEST_ROUTER_ROOT: ${{ github.workspace }}/out/router
        run: uv run --no-sync pytest -q --junitxml=out/gate-full.xml
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-contracts-linux
          path: out/gate-full.xml
